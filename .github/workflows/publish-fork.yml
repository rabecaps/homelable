name: Publish (fork)

# Fork-owned publish workflow. This repo (rabecaps/homelable) is the owner's update-survival
# line: we build and publish the images under OUR ghcr namespace so the homelab can stop pulling
# upstream `latest`. Upstream's `docker-publish.yml` is DISABLED-IN-FORK (manual trigger only) and
# exists here solely so upstream syncs stay conflict-free; this file is the live one.
#
# Tag naming (decided): ghcr.io/rabecaps/homelable-<component>:<ref>
#   - push to main            ->  :main and :latest
#   - push to feat/* or fix/* ->  :<branchname>            (preview builds for the fork pipeline)
#   - semver tag vX.Y.Z       ->  :vX.Y.Z, :X.Y, :X
# Components: backend, frontend, frontend-standalone, mcp.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: ghcr.io/rabecaps/homelable-backend
            context: .
            dockerfile: Dockerfile.backend
            build_args: ""
          - image: ghcr.io/rabecaps/homelable-frontend
            context: .
            dockerfile: Dockerfile.frontend
            build_args: ""
          - image: ghcr.io/rabecaps/homelable-frontend-standalone
            context: .
            dockerfile: Dockerfile.frontend
            build_args: "VITE_STANDALONE=true"
          - image: ghcr.io/rabecaps/homelable-mcp
            context: ./mcp
            dockerfile: Dockerfile.mcp
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max